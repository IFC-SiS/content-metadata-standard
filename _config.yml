jekyll-theme-minimal gives you a left sidebar with the title and a clean reading column — it suits a specification. If you'd rather have a bold header banner, swap in jekyll-theme-cayman. Change the one line and recommit to switch at any time.

If the site goes blank after committing, the YAML has a typo — delete the file and the site reverts to the default immediately.
